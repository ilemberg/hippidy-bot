# Slack app definition for hippidy-bot. Create the app from this file at
# https://api.slack.com/apps (Create New App, From a manifest, YAML tab). See the README's Setup
# section.
display_information:
  name: hippidy-bot
  description: An AI teammate for a product engineering team.
features:
  # The Messages tab, where the bot sends daily briefs and people can write "stop briefs" back
  # (slice 3.4). Without it Slack tells people sending messages to the app is turned off.
  app_home:
    home_tab_enabled: false
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
  bot_user:
    display_name: hippidy-bot
    always_online: true
oauth_config:
  # Sign in with Slack, for the web app (slice 2.3, decision 193). This is the web app's
  # Vercel production domain; change it here, and in WEB_BASE_URL, if the domain differs.
  redirect_urls:
    - https://hippidy-bot-web.vercel.app/auth/slack/callback
  scopes:
    # OpenID Connect: who signed in, and to which workspace. The web app keeps no Slack token.
    user:
      - openid
      - profile
      - email
    bot:
      - app_mentions:read
      # Read a thread's messages since the bot's last reply when it is mentioned (decision 140).
      - channels:history
      - groups:history
      - chat:write
      - reactions:read
      - reactions:write
      # Display names, so the agent can address people (decision 34). Also each person's time
      # zone, for when their daily brief goes (slice 3.4).
      - users:read
      # Daily briefs by direct message (slice 3.4, decision 212): open a direct message with a
      # person, and read "stop briefs" and "start briefs" written there. After changing this,
      # update the app from this manifest and reinstall it.
      - im:write
      - im:history
settings:
  event_subscriptions:
    # The Vercel production domain. Change it here if the production domain changes.
    request_url: https://hippidy-bot.vercel.app/slack/events
    bot_events:
      - app_mention
      # A 🛑 on a message stops the agent in that thread (decision 60).
      - reaction_added
      # Messages in public and private channels the bot is in (slice 2.5). The API keeps only
      # those of channels someone switched listening on in; the rest are dropped unread.
      - message.channels
      - message.groups
      # Messages written to the bot in its direct message (slice 3.4): "stop briefs" and
      # "start briefs". Needs `im:history`; update the app from this manifest and reinstall it.
      - message.im
  # The Start button under a brief (slice 2.1, G17). Bolt answers button presses on the same
  # URL as events. After changing this, update the app from this manifest and reinstall it.
  interactivity:
    is_enabled: true
    request_url: https://hippidy-bot.vercel.app/slack/events
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
